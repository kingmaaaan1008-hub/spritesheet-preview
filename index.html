<style>
  :root { --bg:#14161c; --panel:#1e2129; --border:#363b49; --text:#e8eaf0; --muted:#9aa1b3; --accent:#5b8cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI","Hiragino Sans","Meiryo",sans-serif; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }

  canvas { display:block; image-rendering:auto; }
  .rawimg { max-width:100%; border:1px solid var(--border); border-radius:8px; margin-top:10px; }
  .controls { margin-bottom:20px; font-size:13px; color:var(--muted); }
  .controls input { accent-color:var(--accent); vertical-align:middle; }
  details { margin-top:10px; }
  summary { color:var(--muted); font-size:13px; cursor:pointer; }
  /* ページ送り: 1ページ最大 PER_PAGE キャラ。全カードを一度に animate すると重いので分割する */
  .pager { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:14px 0; }
  .pager button { background:var(--panel); color:var(--text); border:1px solid var(--border);
                  border-radius:6px; padding:5px 11px; font-size:13px; cursor:pointer; font-family:inherit; }
  .pager button:hover:not(:disabled) { border-color:var(--accent); }
  .pager button:disabled { opacity:.4; cursor:default; }
  .pager button.cur { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .pager .info { color:var(--muted); font-size:12px; margin-left:6px; }

const PER_PAGE = 5;
const pageCount = Math.max(1, Math.ceil(GROUPS.length / PER_PAGE));
const cards = document.getElementById("cards");
let players = [];
let page = 0;

function buildCard(g) {
  const card = document.createElement("div");
  card.className = "card";
  const pngList = g.members.length > 1 ? ' · ' + g.members.length + '枚: ' + g.members.map(m => m.png).join(', ') : '';
  card.innerHTML = '<h2>' + g.name + '</h2><div class="date">' + g.date + pngList + '</div>';

  const wrap = document.createElement("div");
  wrap.className = "anims";
  const det = document.createElement("details");
  det.innerHTML = '<summary>シート全体を表示</summary>';
  let hasAnims = false;

  for (const s of g.members) {
    const img = new Image();
    img.src = s.png;
    if (s.meta && s.meta.animations) {
      hasAnims = true;
      for (const [en, anim] of Object.entries(s.meta.animations)) {
        const div = document.createElement("div");
        div.className = "anim";
        const fw = s.meta.frameWidth, fh = s.meta.frameHeight;
        const scale = Math.min(220 / fw, 220 / fh, 1);
        const cw = Math.round(fw * scale), ch = Math.round(fh * scale);
        // 別 png 由来の行は、どのシートから来たかを小さく併記する
        const src = s.suffix ? ' <span class="src">' + s.png + '</span>' : '';
        div.innerHTML = '<div class="label">' + en + '(' + anim.frames + 'コマ)' + src + '</div>' +
          '<span class="checker"><canvas width="' + cw + '" height="' + ch + '"></canvas></span>';
        wrap.appendChild(div);
        players.push({ img, anim, fw, fh, canvas: div.querySelector("canvas"), idx: 0, last: 0 });
      }
    }
    // シート全体の画像は details を開くまで読み込まない(重いので)
    const raw = new Image();
    raw.className = "rawimg";
    raw.dataset.src = s.png;
    if (!hasAnims) raw.src = s.png;
    (hasAnims ? det : card).appendChild(raw);
  }

  if (hasAnims) {
    card.appendChild(wrap);
    det.addEventListener("toggle", () => {
      if (!det.open) return;
      for (const raw of det.querySelectorAll("img.rawimg")) {
        if (!raw.src) raw.src = raw.dataset.src;
      }
    });
    card.appendChild(det);
  }
  return card;
}

function renderPagers() {
  const total = GROUPS.length;
  const from = page * PER_PAGE + 1, to = Math.min(total, (page + 1) * PER_PAGE);
  for (const el of [document.getElementById("pagerTop"), document.getElementById("pagerBottom")]) {
    el.innerHTML = "";
    const prev = document.createElement("button");
    prev.textContent = "← 前";
    prev.disabled = page === 0;
    prev.onclick = () => show(page - 1);
    el.appendChild(prev);
    for (let i = 0; i < pageCount; i++) {
      const b = document.createElement("button");
      b.textContent = String(i + 1);
      if (i === page) b.className = "cur";
      b.onclick = () => show(i);
      el.appendChild(b);
    }
    const next = document.createElement("button");
    next.textContent = "次 →";
    next.disabled = page === pageCount - 1;
    next.onclick = () => show(page + 1);
    el.appendChild(next);
    const info = document.createElement("span");
    info.className = "info";
    info.textContent = total + ' キャラ中 ' + from + '〜' + to + ' 件を表示(1ページ最大 ' + PER_PAGE + ' キャラ)';
    el.appendChild(info);
  }
}

function show(p) {
  page = Math.min(Math.max(0, p), pageCount - 1);
  location.hash = "p" + (page + 1);
  players = [];            // 前のページの canvas は捨てて、描画対象を今のページだけにする
  cards.innerHTML = "";
  for (const g of GROUPS.slice(page * PER_PAGE, (page + 1) * PER_PAGE)) cards.appendChild(buildCard(g));
  renderPagers();
  window.scrollTo({ top: 0 });
}

const fromHash = Number((location.hash.match(/^#p(\d+)$/) || [])[1]);
show(Number.isFinite(fromHash) && fromHash > 0 ? fromHash - 1 : 0);

const fpsInput = document.getElementById("fps"), fpsOut = document.getElementById("fpsOut");
fpsInput.addEventListener("input", () => fpsOut.textContent = fpsInput.value);

function loop(now) {
  requestAnimationFrame(loop);
  const interval = 1000 / Number(fpsInput.value);
  for (const p of players) {
    if (!p.img.complete) continue;
    if (now - p.last >= interval) {
      p.last = now;
      p.idx = (p.idx + 1) % p.anim.frames;
    }
    const rect = p.anim.frameRects[p.idx];
    const ctx = p.canvas.getContext("2d");
    ctx.clearRect(0, 0, p.canvas.width, p.canvas.height);
    ctx.drawImage(p.img, rect.x, rect.y, rect.w, rect.h, 0, 0, p.canvas.width, p.canvas.height);
  }
}
requestAnimationFrame(loop);
</script>
